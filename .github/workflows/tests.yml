name: Manager tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy opencv-python PyQt5 matplotlib pandas
      - run: python -m unittest discover -s analysis/particle_tracking_app_v0_1/tests -v
      - run: python -m unittest discover -s analysis/dynamic_pair_analysis/tests -v
